name = "unciv-civ6"
main = "src/index.ts"
compatibility_date = "2024-09-20"

[durable_objects]
bindings = [{ name = "GAME_ROOM", class_name = "GameRoom" }]

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

[vars]
# Like flagfish/horse - set your KV or D1
# For KV:
# kv_namespaces = [{ binding = "GAMES", id = "your-kv-id" }]

# For D1 (preferred for Civ6 v10 JSON):
# d1_databases = [{ binding = "DB", database_name = "unciv_civ6", database_id = "your-d1-id" }]

# R2 for backups
# r2_buckets = [{ binding = "BACKUPS", bucket_name = "unciv-civ6-backups" }]

[env.production]
name = "unciv-civ6"
